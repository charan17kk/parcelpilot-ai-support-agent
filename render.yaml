services:
  - type: web
    name: parcelpilot-ai-support-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SESSION_TOKEN_PEPPER
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: FRONTEND_ORIGIN
        value: https://parcelpilot-ai-support-agent-ygsf.onrender.com
      - key: OPENROUTER_MODEL
        value: liquid/lfm-2.5-2.6b:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: inclusionai/ling-3.0-flash-vl:free,openrouter/free
      - key: LLM_TIMEOUT_SECONDS
        value: 25
      - key: LLM_MAX_RETRIES
        value: 0
      - key: LLM_MAX_OUTPUT_TOKENS
        value: 600
      - key: STATIC_FILES_DIR
        value: /app/frontend
      - key: AGENT_MAX_LLM_CALLS
        value: 4
      - key: AGENT_MAX_TOOL_STEPS
        value: 6
      - key: DEMO_USER_PASSWORD
        value: ParcelPilotDemo!
