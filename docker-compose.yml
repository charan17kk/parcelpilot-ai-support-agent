name: parcelpilot

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parcelpilot}
      POSTGRES_USER: ${POSTGRES_USER:-parcelpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcelpilot_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - parcelpilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-parcelpilot}:${POSTGRES_PASSWORD:-parcelpilot_local}@db:5432/${POSTGRES_DB:-parcelpilot}
      DATA_PACK_DIR: /app/data/raw
      DATA_MANIFEST_PATH: /app/data/manifest.yml
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
      - parcelpilot_model_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  parcelpilot_postgres:
  parcelpilot_model_cache:
